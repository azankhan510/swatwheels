{% extends "base.html" %}
{% block content %}

<div class="cars-hero">
  <h1>Imagine the<br>possibilities</h1>
  <img id="hero-img" src="https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=900">
  <p id="hero-text">sponsored: toyota prius</p>


</div>

<div class="tabs">
  <button class="active">Shop car</button>
  <a href="/add_car">Sell your car</a>
</div>

<form action="/cars" method="GET" class="search-box">
  <input type="text" name="q" placeholder="Try luxury suvs under 10 lakh">
  <button>🔍</button>
</form>

<p class="or">- Or search by -</p>

<form action="/cars" method="GET" class="filters">
  <select name="condition"><option>New/used</option><option>New</option><option>Used</option></select>
  <select name="make"><option>Make</option><option>Toyota</option><option>Suzuki</option><option>Honda</option></select>
  <select name="budget"><option>Budget Price</option><option value="1000000">Under 10 Lakh</option><option value="2000000">Under 20 Lakh</option></select>
  <select name="model"><option>Model</option><option>Corolla</option><option>Mehran</option><option>Civic</option></select>
  <button class="btn-big">Search Cars</button>
</form>

<script>
const cars = [
  { name: "TOYOTA PRIUS", img: "https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=900" },
  { name: "TOYOTA COROLLA HYBRID", img: "https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=900" },
  { name: "HONDA VEZEL", img: "https://images.unsplash.com/photo-1606611013016-969c19ba27bb?w=900" },
  { name: "TOYOTA MARK X", img: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=900" },
  { name: "TOYOTA LAND CRUISER", img: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=900" },
  { name: "TOYOTA CROWN", img: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=900" },
  { name: "SUZUKI ALTO", img: "https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=900" },
  { name: "DAIHATSU MIRA", img: "https://images.unsplash.com/photo-1542362567-b07e54358753?w=900" },
  { name: "TOYOTA VITZ", img: "https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?w=900" },
  { name: "TOYOTA PREMIO", img: "https://images.unsplash.com/photo-1553440569-bcc63803a83d?w=900" },
  { name: "TOYOTA AQUA", img: "https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=900" },
  { name: "TOYOTA SUPRA", img: "https://images.unsplash.com/photo-1626668893632-6f3d4466d22f?w=900" }
];
const hour = new Date().getHours();
const index = Math.floor(hour / 2) % 12;
document.getElementById("hero-img").src = cars[index].img;
document.getElementById("hero-text").innerText = "SPONSORED: " + cars[index].name;
</script>

{% endblock %}
