{% extends "base.html" %}
{% block content %}

<div class="cars-hero">
  <h1>Imagine the<br>possibilities</h1>
  <img id="hero-img" src="https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=900">
  <p id="hero-text">sponsored: toyota prius</p>


</div>

<div class="tabs">
  <button class="tab-btn active" onclick="showShop()">Shop cars</button>
  <button class="tab-btn" onclick="showSell()">Sell your car</button>
</div>

<form action="/cars" method="GET" class="search-box">
  <input type="text" name="q" placeholder="Try luxury suvs under 10 lakh">
  <button>🔍</button>
</form>

<p class="or">- Or search by -</p>

<form action="/cars" method="GET" class="filters">
  <select name="condition"><option>New/used</option><option>New</option><option>Used</option></select>
  <select name="make"><option>Make</option><option>Toyota</option><option>Suzuki</option><option>Honda</option></select>
  <select name="budget"><option>Budget Price</option><option value="1000000">Under 10 Lakh</option><option value="2000000">Under 20 Lakh</option></select>
  <select name="model"><option>Model</option><option>Corolla</option><option>Mehran</option><option>Civic</option></select>
  <button class="btn-big">Search Cars</button>
</form>

<script>
const cars = [
  { name: "TOYOTA PRIUS", img: "https://media.drive.com.au/obj/tx_q:50,rs:auto:1920:1080:1/driveau/upload/cms/uploads/oZA1QEbTCFa4EEpmL0gd" },
  { name: "TOYOTA COROLLA HYBRID", img: "https://cache4.pakwheels.com/ad_pictures/1382/toyota-corolla-hybrid-s-3-2020-138243627.webp" },
  { name: "HONDA VEZEL", img: "https://www.ultimatespecs.com/cargallery/43/11925/Honda-Vezel-2021-1.jpg" },
  { name: "TOYOTA MARK X", img: "https://agnibrainly.netlify.app/image/2019/04/Toyota-Mark-X-Final-Edition-1.jpg" },
  { name: "TOYOTA LAND CRUISER", img: "https://media.auto5.vn/files/hoanghai98/2021/07/01/la 6-141659.jpg" },
  { name: "TOYOTA CROWN", img: "https://domcar.com.cy/upload/iblock/a17/a1792de3cf0c0ccd7851e98df5c9b52e.jpg" },
  { name: "SUZUKI ALTO", img: "https://cache4.pakwheels.com/ad_pictures/1367/suzuki-alto-l-upgrade-2022-136763171.webp" },
  { name: "DAIHATSU MIRA", img: "https://storage.yandexcloud.net/toki-bucket/japan/2026/02/18/c6691f5f6afbb380b7770f3336d50f9f.jpg" },
  { name: "TOYOTA VITZ", img: "https://global.toyota/pages/models/images/20191018/kv/vitz_ogp_01.jpg" },

  { name: "TOYOTA SUPRA", img: "https://www.nastol.com.ua/pic/202010/1280x1024/nastol.com.ua-425467.jpg" }

const index = Math.floor(hour / 2) % 12;
document.getElementById("hero-img").src = cars[index].img;
document.getElementById("hero-text").innerText = "SPONSORED: " + cars[index].name;
</script>

{% endblock %}
