<!DOCTYPE html>
<html>
<head>
<title>Join SwatWheels</title>
<style>
body{margin:0; font-family:Arial; background:#eef7f0; display:flex; justify-content:center;}
.box{width:100%; max-width:420px; padding:20px 25px 35px;}
.back{font-size:28px;}
h1{font-size:32px; margin:15px 0 5px;}
.sub{color:#777; font-size:15px; line-height:1.4;}
label{display:block; font-weight:bold; font-size:12px; letter-spacing:1px; margin:18px 0 6px;}
input,select{width:100%; padding:14px; border-radius:10px; border:1px solid #cfe3d3; box-sizing:border-box; font-size:15px; outline:none; background:white;}
.check{display:flex; gap:10px; align-items:flex-start; margin:18px 0; font-size:14px; color:#666;}
.check input{width:18px; height:18px; margin:0;}
.btn{width:100%; padding:15px; background:#1a5c3a; color:white; border:none; border-radius:10px; font-weight:bold; font-size:17px; cursor:pointer;}
.loginbox{margin-top:15px; background:white; border:1px solid #cfe3d3; padding:14px; border-radius:10px; text-align:center; color:#888;}
.loginbox b{color:#1a5c3a;}
#extra{display:none; background:white; padding:15px; border-radius:12px; border:1px solid #cfe3d3; margin-top:15px;}
a{color:inherit; text-decoration:none;}
</style>
</head>
<body>
<div class="box">
<a href="/"><div class="back">←</div></a>
<h1>Join SwatWheels</h1>
<p class="sub">Create an account to start selling, chatting, and finding your dream vehicle today.</p>

<form method="POST">
  <label>YOU ARE?</label>
  <select name="acc_type" id="acc_type" onchange="showExtra()">
    <option value="1">1: Individual</option>
    <option value="2">2: Showroom or Company</option>
    <option value="3">3: Admin</option>
  </select>

  <label>FULL NAME</label>
  <input type="text" name="username" placeholder="Full Name" required>

  <label>CNIC NUMBER</label>
  <input type="text" name="cnic" placeholder="15602-1234567-1" required>

  <label>EMAIL ADDRESS</label>
  <input type="email" name="email" placeholder="ali@gmail.com" required>

  <label>PHONE NUMBER</label>
  <input type="text" name="phone" placeholder="0345-1234567" required>

  <div id="extra">
    <label>ACCOUNT TYPE</label>
    <input type="text" name="account_type" placeholder="e.g. showroom / company">
    <label>ESTABLISHMENT YEAR</label>
    <input type="text" name="establishment_year" placeholder="e.g. 2015">
    <label>SHOWROOM ADDRESS</label>
    <input type="text" name="showroom_address" placeholder="Showroom Address">
  </div>

  <label>PASSWORD</label>
  <input type="password" name="password" placeholder="Create a strong password" required>
  
  <label>BIO</label>
  <input type="text" name="bio" placeholder="Write a short bio about yourself" required>

  <div class="check"><input type="checkbox" required> <span>I agree to Terms & Conditions</span></div>
  <button class="btn" type="submit">Create Account</button>
</form>

<a href="/login"><div class="loginbox">Already have an account? <b>Login Instead</b></div></a>
</div>

<script>
function showExtra(){
  var r = document.getElementById("acc_type").value;
  document.getElementById("extra").style.display = (r=="2") ? "block" : "none";
}
</script>
</body>
</html>
