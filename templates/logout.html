<!DOCTYPE html>
<html>
<head>
<title>Logout - SwatWheels</title>
<style>
body{margin:0; font-family:Arial; background:#eef7f0; display:flex; justify-content:center;}
.box{width:100%; max-width:420px; padding:60px 25px; text-align:center;}
.icon{width:80px; height:80px; background:#ffe9e9; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:40px; margin:auto;}
h1{font-size:28px; margin:20px 0 5px;}
p{color:#777;}
input{width:100%; padding:14px; border-radius:10px; border:1px solid #cfe3d3; box-sizing:border-box; font-size:15px; margin-top:15px; text-align:center;}
.yes{width:100%; padding:15px; background:#c00; color:white; border:none; border-radius:10px; font-weight:bold; margin-top:15px; font-size:16px; cursor:pointer;}
.no{display:block; background:white; border:1px solid #cfe3d3; padding:14px; border-radius:10px; font-weight:bold; margin-top:12px;}
a{color:inherit; text-decoration:none;}
</style>
</head>
<body>
<div class="box">
<div class="icon">👋</div>
<h1>Logout?</h1>
<p>Kya tum waqai logout karna chahte ho?</p>
<form method="POST">
<input type="text" name="confirm" placeholder="y likho logout ke liye" required>
<button class="yes" type="submit">YES, LOGOUT</button>
</form>
<a href="/"><div class="no">Nahi, Wapas Jao</div></a>
</div>
</body>
</html>
