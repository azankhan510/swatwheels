 <h1>Dashboard</h1>
    <p>Welcome, {{ user.username }}!</p>
    <a href="{{ url_for('profile') }}">View Profile</a>
    <a href="{{ url_for('logout') }}">Logout</a>

    <h2>Your Listed Cars</h2>

      {% if cars %}
         <ul>
               {% for car in cars %}
                  <li>{{ car.company }} {{ car.model }} ({{ car.price }} {{ car.title }}{{ car.city}} )</li>
                  <form action="/delete-car-listing/{{loop.index0}}" method="POST" style="display:inline;">
                     <button type="submit" onclick="return confirm('Are you sure you want to delete this car listing?');">Delete</button>
                  </form>
               </ul>   
                     {% endfor %}

         </ul>
      {% else %}
         <p>You have not listed any cars yet.</p>
      {% endif %}
